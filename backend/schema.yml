openapi: 3.0.3
info:
  title: ApparelDesk API
  version: 1.0.0
  description: REST API for ApparelDesk e-commerce platform
paths:
  /api/accounts/signup/:
    post:
      operationId: accounts_signup_create
      description: |-
        Portal signup API endpoint.
        Creates a User with role='portal' and an associated Contact with type='customer'.
        Both operations are wrapped in a database transaction for atomicity.

        Request body:
        {
            "name": "John Doe",
            "email": "john@example.com",
            "password": "securepassword123",
            "mobile": "+1234567890",  // optional
            "city": "Mumbai",  // optional
            "state": "Maharashtra",  // optional
            "pincode": "400001"  // optional
        }

        Returns:
        {
            "user": {
                "id": 1,
                "email": "john@example.com",
                "name": "John Doe",
                "role": "portal"
            },
            "contact": {
                "id": 1,
                "name": "John Doe",
                "type": "customer",
                "email": "john@example.com"
            },
            "tokens": {
                "refresh": "...",
                "access": "..."
            }
        }
      tags:
      - accounts
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/catalog/:
    get:
      operationId: catalog_list
      description: |-
        Public read-only ViewSet for published products.
        No authentication required.

        Provides:
        - list: GET /api/products/catalog/
        - retrieve: GET /api/products/catalog/{id}/

        Requirements: 2.1, 2.2, 2.3, 2.4
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: product_category
        schema:
          type: string
      - in: query
        name: product_type
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - catalog
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
  /api/catalog/{id}/:
    get:
      operationId: catalog_retrieve
      description: |-
        Public read-only ViewSet for published products.
        No authentication required.

        Provides:
        - list: GET /api/products/catalog/
        - retrieve: GET /api/products/catalog/{id}/

        Requirements: 2.1, 2.2, 2.3, 2.4
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/coupons/:
    get:
      operationId: coupons_list
      description: |-
        ViewSet for Coupon CRUD operations.
        Internal users only.

        Provides:
        - list: GET /api/coupons/
        - create: POST /api/coupons/
        - retrieve: GET /api/coupons/{id}/
        - update: PUT /api/coupons/{id}/
        - partial_update: PATCH /api/coupons/{id}/
        - destroy: DELETE /api/coupons/{id}/
        - validate_coupon: POST /api/coupons/validate/
        - my_coupons: GET /api/coupons/my-coupons/

        Requirements: 13.1, 13.2, 13.3, 13.5
      parameters:
      - in: query
        name: discount_offer
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - cancelled
          - expired
          - used
        description: |-
          Current status of the coupon

          * `active` - Active
          * `used` - Used
          * `expired` - Expired
          * `cancelled` - Cancelled
      tags:
      - coupons
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCouponList'
          description: ''
    post:
      operationId: coupons_create
      description: |-
        ViewSet for Coupon CRUD operations.
        Internal users only.

        Provides:
        - list: GET /api/coupons/
        - create: POST /api/coupons/
        - retrieve: GET /api/coupons/{id}/
        - update: PUT /api/coupons/{id}/
        - partial_update: PATCH /api/coupons/{id}/
        - destroy: DELETE /api/coupons/{id}/
        - validate_coupon: POST /api/coupons/validate/
        - my_coupons: GET /api/coupons/my-coupons/

        Requirements: 13.1, 13.2, 13.3, 13.5
