components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Coupon:
      type: object
      description: |-
        Serializer for Coupon model.
        Includes discount_percentage from related offer and validates coupon code format.

        Requirements: 7.1, 7.2, 13.1, 13.2
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          description: Unique coupon code
          pattern: ^[A-Za-z0-9_-]+$
          maxLength: 50
        expiration_date:
          type: string
          format: date
          description: Date when coupon expires
        status:
          allOf:
          - $ref: '#/components/schemas/CouponStatusEnum'
          description: |-
            Current status of the coupon

            * `active` - Active
            * `used` - Used
            * `expired` - Expired
            * `cancelled` - Cancelled
        contact:
          type: integer
          nullable: true
          description: 'Optional: Assign coupon to specific contact'
        discount_offer:
          type: integer
          description: Linked discount offer
        discount_offer_name:
          type: string
          readOnly: true
        discount_percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - discount_offer
      - discount_offer_name
      - discount_percentage
      - expiration_date
      - id
      - updated_at
    CouponRequest:
      type: object
      description: |-
        Serializer for Coupon model.
        Includes discount_percentage from related offer and validates coupon code format.

        Requirements: 7.1, 7.2, 13.1, 13.2
      properties:
        code:
          type: string
          minLength: 1
          description: Unique coupon code
          pattern: ^[A-Za-z0-9_-]+$
          maxLength: 50
        expiration_date:
          type: string
          format: date
          description: Date when coupon expires
        status:
          allOf:
          - $ref: '#/components/schemas/CouponStatusEnum'
          description: |-
            Current status of the coupon

            * `active` - Active
            * `used` - Used
            * `expired` - Expired
            * `cancelled` - Cancelled
        contact:
          type: integer
          nullable: true
          description: 'Optional: Assign coupon to specific contact'
        discount_offer:
          type: integer
          description: Linked discount offer
      required:
      - code
      - discount_offer
      - expiration_date
    CouponStatusEnum:
      enum:
      - active
      - used
      - expired
      - cancelled
      type: string
      description: |-
        * `active` - Active
        * `used` - Used
        * `expired` - Expired
        * `cancelled` - Cancelled
    CustomerInvoice:
      type: object
      description: |-
        Serializer for CustomerInvoice model.
        Includes order_id and customer_email for display purposes.
        Read-only fields for calculated amounts.

        Requirements: 8.1, 8.2, 8.3
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
          description: Source sale order for this invoice
        order_id:
          type: integer
          readOnly: true
        customer_email:
          type: string
          format: email
          readOnly: true
        invoice_date:
          type: string
          format: date
          readOnly: true
          description: Date when invoice was created
        due_date:
          type: string
          format: date
          description: Payment due date
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Total invoice amount (copied from order)
        status:
          allOf:
          - $ref: '#/components/schemas/StatusF46Enum'
          description: |-
            Current status of the invoice

            * `draft` - Draft
            * `confirmed` - Confirmed
            * `cancelled` - Cancelled
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
